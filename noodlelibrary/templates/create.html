<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            href="https://cdn.jsdelivr.net/gh/spaceoceanoutlook/static-assets@master/images/noodles/favicon.ico"
        />
        <link rel="stylesheet" href="/static/styles.css" />
        <title>Создать лапшу</title>
    </head>
    <body>
        <div class="header">
            <a href="/"><h1>MyNoodles</h1></a>
        </div>

        <div class="form-container">
            <form action="/create" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Название лапши</label>
                    <input type="text" id="title" name="title" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" class="form-control"></textarea>
                </div>

                <div class="form-group">
                    <label for="prep_type">Способ приготовления</label>
                    <select id="prep_type" name="prep_type" class="form-control">
                        <option value="PACKET">Заварить в тарелке</option>
                        <option value="CUP">Залить в упаковку</option>
                        <option value="COOK">Варить в кастрюле</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dish_base">Лапша или рис</label>
                    <select id="dish_base" name="dish_base" class="form-control">
                        <option value="NOODLE">Лапша</option>
                        <option value="RICE">Рис</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Название постера</label>
                    <input type="text" id="image" name="image" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="manufacture">Изготовитель</label>
                    <select id="manufacture" name="manufacture_id" class="form-control">
                        {% for manufacture in manufacturers %}
                        <option value="{{ manufacture.id }}">
                            {{ manufacture.name }}
                        </option>
                        {% endfor %}
                    </select>
                    <input
                        type="text"
                        id="new_manufacture"
                        name="new_manufacture"
                        class="form-control"
                        placeholder="Новый изготовитель"
                        style="margin-top: 8px;"
                    />
                </div>

                <div class="form-group">
                    <label for="country">Страна</label>
                    <select id="country" name="country_id" class="form-control">
                        {% for country in countries %}
                        <option value="{{ country.id }}">{{ country.name }}</option>
                        {% endfor %}
                    </select>
                    <input
                        type="text"
                        id="new_country"
                        name="new_country"
                        class="form-control"
                        placeholder="Новая страна"
                        style="margin-top: 8px;"
                    />
                </div>

                <div class="form-group checkbox-group">
                    <input
                        type="checkbox"
                        id="recommendation"
                        name="recommendation"
                        value="true"
                    />
                    <label for="recommendation">Рекомендовать</label>
                </div>

                <div class="form-group">
                    <label for="code">Код авторизации</label>
                    <input type="text" id="code" name="code" class="form-control" required />
                </div>

                <div class="form-group" style="margin-top: 24px;">
                    <button type="submit" class="btn btn-save" style="width: 100%;">Создать</button>
                </div>
            </form>
        </div>
    </body>
</html>
